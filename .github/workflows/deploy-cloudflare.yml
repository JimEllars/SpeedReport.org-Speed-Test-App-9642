name: Validate and deploy to Cloudflare

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy-worker:
    name: Deploy production Worker
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies & build
        run: |
          npm ci
          npm run build
      - name: Install Worker dependencies
        run: |
          cd speedreport-worker
          npm ci
      - name: Validate / Deploy Worker
        run: |
          cd speedreport-worker
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "No Cloudflare API token detected. Executing dry-run verification."
            npx wrangler deploy --dry-run
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
